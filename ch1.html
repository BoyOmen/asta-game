<script>
"use strict";
const $=s=>document.querySelector(s),W=360,H=640,cv=$('#cv'),g=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);

/* ---------- audio ---------- */
let A,M,RV;
function au(){if(!A){A=new(window.AudioContext||window.webkitAudioContext)();const c=A.createDynamicsCompressor();c.threshold.value=-20;c.ratio.value=4;M=A.createGain();M.gain.value=.85;M.connect(c);c.connect(A.destination);
 const n=A.sampleRate*1.6|0,b=A.createBuffer(2,n,A.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
 RV=A.createConvolver();RV.buffer=b;const rg=A.createGain();rg.gain.value=.3;RV.connect(rg);rg.connect(M)}return A}
function out(n,wet){n.connect(M);if(wet){const w=A.createGain();w.gain.value=wet;n.connect(w);w.connect(RV)}}
function env(n,T,a,d,v){n.gain.setValueAtTime(.0001,T);n.gain.linearRampToValueAtTime(v,T+a);n.gain.exponentialRampToValueAtTime(.0001,T+a+d)}
function tone(f,d,ty='sine',v=.1,f2,wet=.2){try{const a=au(),T=a.currentTime,o=a.createOscillator(),n=a.createGain();o.type=(ty=='square'||ty=='sawtooth')?'triangle':ty;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);env(n,T,.006,d,v);o.connect(n);out(n,wet);o.start(T);o.stop(T+d+.05)}catch(e){}}
function noise(d,v,fr,loop,ty='bandpass',q=1,wet=.1){try{const a=au(),T=a.currentTime,len=a.sampleRate*(loop?3:d)|0,b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),n=a.createGain();s.buffer=b;s.loop=!!loop;f.type=ty;f.frequency.value=fr;f.Q.value=q;if(loop)n.gain.value=v;else env(n,T,.006,d,v);s.connect(f);f.connect(n);out(n,wet);s.start(T)}catch(e){}}
const bell=(f,v=.08)=>[[1,1],[2.76,.5],[5.4,.25]].forEach(([r,k])=>tone(f*r,1.5/Math.pow(r,.3),'sine',v*k,0,.5));

const SC=[['تومار اول — صحنه‌ی جرم','لرد ویکتور در اتاقی قفل‌شده جان داد. فنجان چای دست‌نخورده است؛ پس سمّی خورده نشده. هر دو ساعت در ساعت ۳ بامداد ایستاده‌اند. نخستین رقم گاوصندوق: ۳.'],['تومار دوم — مظنونان','۱. سرآشپز دربار ۲. دکتر آرتور، پزشک و ساعت‌ساز قصر ۳. سرتیپ نگهبانان. در کیف، اسپری حلال را با کلید قیراندود ترکیب کن تا رقم دوم روی دسته‌اش پیدا شود: ۷.'],['تومار سوم — سازوکار قتل','لرد ویکتور هر شب ساعت ۳ مقابل آینه ساعتش را کوک می‌کرد. قاتل لوله‌ی بخار جیوه‌ی تحت‌فشار را پشت آینه به فنر زنگ ساعت ۳ وصل کرده بود. نور فرابنفش را روی آینه‌های تالار بتاب تا رقم سوم را بیابی: ۴.'],['تومار چهارم — انگیزه','لرد ویکتور فهمیده بود دکتر آرتور امضاها را جعل می‌کند و شمش‌های طلای خاندان را می‌دزدد. با رمز ۳۷۴ گاوصندوق تالار پذیرایی را باز کن و مُهر سلطنتی ماه خونین را بردار.'],['تومار پنجم — خلاصه‌ی ادله','ردپای شیمیایی دکتر آرتور تا آزمایشگاه، کف دست او روی تابوت، لوله‌ی جیوه پشت آینه‌ی شکسته و ساعت‌هایی که روی ۳ ایستاده‌اند. اکنون در میز استنتاج حکم نهایی را صادر کن.']];
